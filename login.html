<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Iniciar Sesión</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">🚚</span>
      <span class="logo-text">inti<span class="logo-accent">dev</span><span class="logo-dot">.</span></span>
    </div>

    <h1>Iniciar Sesión</h1>

    <form id="loginForm">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" value="" autofocus>

      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" value="">
        <button type="button" class="toggle-password" aria-label="Mostrar contraseña">👁</button>
      </div>

      <p id="errorMessage" class="error"></p>

      <button type="submit" class="login-button">Ingresar</button>

      <a href="#" class="forgot-password">Recuperar Contraseña</a>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
