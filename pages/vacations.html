<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Solicitud de Vacaciones</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/vacations.css">
</head>
<body>

<button id="menuToggle" class="menu-toggle" aria-label="Abrir menú">☰</button>
<div id="overlay" class="overlay"></div>

<aside id="sidebar" class="sidebar">
  <div class="sidebar-logo">
    <span class="logo-circle">☁</span>
    <p class="company-name">INTIDEV</p>
    <p class="role-label">Empleados</p>
  </div>
  <nav id="sidebarNav"></nav>

  <button id="logoutBtn" class="logout-button">⏻ Cerrar Sesión</button>
</aside>

<div class="main">
  <header class="brand-header">
    <span class="brand-logo">INTIDEV</span>
  </header>

  <div class="user-bar">
    <span class="welcome-message">BIENVENIDO</span>
  </div>

  <main class="content vacation-content">

    <section class="intro-section">
      <h2>Solicita tus Vacaciones</h2>
    </section>

    <section class="request-form">
      <h2>Registra tu solicitud</h2>

      <label>👤 Solicitante</label>
      <input type="text" id="requesterInput" value="" disabled>

      <label>🧑‍💼 Aprobador</label>
      <div class="input-with-button">
        <input type="text" id="approverInput" value="" disabled>
        <button type="button" disabled>🔍</button>
      </div>
    </section>

    <section class="procedure-section">
      <h2>Trámite</h2>

      <label>📅 Fecha de Salida</label>
      <input type="date" id="startDateInput">

      <label>📅 Fecha de Retorno</label>
      <input type="date" id="endDateInput">

      <label>🏷 Saldo de Vacaciones</label>
      <input type="text" id="balanceInput" value="" disabled>

      <label>🏷 Días</label>
      <input type="text" id="daysInput" value="" disabled>

      <label>💬 Coordinaciones / Comentarios</label>
      <textarea id="commentsInput" rows="4"></textarea>

      <p id="vacationError" class="error"></p>

      <button type="button" id="saveButton" class="save-button">Guardar 💾</button>
    </section>

  </main>
</div>

<script src="../js/common.js"></script>
<script src="../js/vacations.js"></script>
</body>
</html>
